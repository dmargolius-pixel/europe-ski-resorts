name: Deep-Discovery Ski Lift Pass Scraper

on:
  workflow_dispatch:
    inputs:
      offset:
        description: 'Starting row offset index (e.g. 0, 50, 100)'
        required: true
        default: '0'
      limit:
        description: 'Batch size (Number of resorts to process, e.g. 50)'
        required: true
        default: '50'

permissions:
  contents: write

jobs:
  run-deep-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies & Headless Chromium
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 urllib3 playwright
          playwright install chromium
          sudo apt-get update -y && playwright install-deps chromium || true

      - name: Execute 4-Stage Deep Discovery Batch
        run: |
          python batch_lift_pass_scraper.py --offset ${{ github.event.inputs.offset }} --limit ${{ github.event.inputs.limit }}

      - name: Commit and Push Updated CSVs to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "Ski resorts - Updated 2026-27.csv" lift_pass_batch_audit.csv || true
          git commit -m "Chore: Deep scrape batch offset ${{ github.event.inputs.offset }} (limit ${{ github.event.inputs.limit }})" || exit 0
          git push || true

      - name: Upload Updated Dataset & Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lift-pass-batch-offset-${{ github.event.inputs.offset }}
          path: |
            Ski resorts - Updated 2026-27.csv
            lift_pass_batch_audit.csv
