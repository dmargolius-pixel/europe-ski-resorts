name: Continuous Ski Resort Lift Pass Scraper (Phase 1)

on:
  schedule:
    # Runs at 02:00 on the 1st of every month
    - cron: '0 2 1 * *'
  # Allows you to trigger the workflow manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  run-tiered-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tiered Lift Pass Scraper
        run: |
          python update_lift_passes.py

      - name: Check Generated Output Files
        id: check_files
        run: |
          if [ -f "Ski resorts - Updated 2026-27.csv" ]; then
            echo "has_csv=true" >> $GITHUB_OUTPUT
          else
            echo "has_csv=false" >> $GITHUB_OUTPUT
          fi
          if [ -f "lift_pass_audit_report.csv" ]; then
            echo "has_audit=true" >> $GITHUB_OUTPUT
          else
            echo "has_audit=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Updated Dataset Artifact
        if: steps.check_files.outputs.has_csv == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updated-lift-passes-2026-27
          path: Ski resorts - Updated 2026-27.csv
          retention-days: 30

      - name: Upload Audit Report Artifact
        if: steps.check_files.outputs.has_audit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lift-pass-audit-report
          path: lift_pass_audit_report.csv
          retention-days: 30
