name: Continuous Ski Resort Link Health Monitor

on:
  schedule:
    # Runs at 08:00 AM on the 1st of every month
    - cron: '0 8 1 * *'
  # Allows manual runs anytime
  workflow_dispatch:

jobs:
  run-link-checker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run Link Auditor (Fetches Live CSV from Google Drive)
        run: |
          python check_links.py

      - name: Check for Broken Links Report
        id: check_report
        run: |
          if [ -f "broken_links_report.csv" ]; then
            echo "has_errors=true" >> $GITHUB_OUTPUT
          else
            echo "has_errors=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Broken Links Artifact
        if: steps.check_report.outputs.has_errors == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: broken-links-report
          path: broken_links_report.csv
