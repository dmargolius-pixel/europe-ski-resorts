name: Build and Update Ski Weather Data

on:
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Data Collector Scripts
        run: |
          python scripts/fetch_tracker_data.py
          python scripts/fetch_personal_tracker_data.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/el-nino-tracker.json data/season-history.json data/personal-tracker.json data/personal-history.json
          git diff --cached --quiet || (git commit -m "Auto-update public and personal ski trackers [skip ci]" && git push)

      - name: Purge jsDelivr Cache
        run: |
          curl -s "https://purge.jsdelivr.net/gh/dmargolius-pixel/europe-ski-resorts@main/data/el-nino-tracker.json"
          curl -s "https://purge.jsdelivr.net/gh/dmargolius-pixel/europe-ski-resorts@main/data/season-history.json"
          curl -s "https://purge.jsdelivr.net/gh/dmargolius-pixel/europe-ski-resorts@main/data/personal-tracker.json"
          curl -s "https://purge.jsdelivr.net/gh/dmargolius-pixel/europe-ski-resorts@main/data/personal-history.json"
