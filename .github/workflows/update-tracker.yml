name: Update Ski Tracker Data

on:
  schedule:
    # Runs every day at 02:47 UTC
    - cron: '47 2 * * *'
  workflow_dispatch:

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Data Collector Script
        run: python scripts/fetch_tracker_data.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/el-nino-tracker.json
          git commit -m "Auto-update El Nino tracker metrics [skip ci]" || exit 0
          git push

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/el-nino-tracker.json data/season-history.json
          git commit -m "Auto-update El Nino tracker and season history [skip ci]" || exit 0
          git push

      - name: Purge jsDelivr Cache
        run: |
          curl -s "https://purge.jsdelivr.net/gh/dmargolius-pixel/europe-ski-resorts@main/data/el-nino-tracker.json"
